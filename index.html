<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Final Project</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header>
    <h1 id="top">Final Project</h1>
  </header>

  <main>
    <p>This gallery presents nine simple scenes from nature and everyday places, including beaches, mountains, forests, and cities.</p>

    <p>Each image has a short caption and alternative text so visitors can understand the subject of every scene.</p>

    <div class="grid">
      <figure>
        <img src="images/beach.svg" alt="A quiet beach under a blue sky" width="200">
        <figcaption>Quiet Beach</figcaption>
      </figure>

      <figure>
        <img src="images/mountain.svg" alt="Green mountains beneath the morning sun" width="200">
        <figcaption>Morning Mountains</figcaption>
      </figure>

      <figure>
        <img src="images/forest.svg" alt="A peaceful forest with tall trees" width="200">
        <figcaption>Peaceful Forest</figcaption>
      </figure>

      <figure>
        <img src="images/city.svg" alt="A modern city skyline at sunset" width="200">
        <figcaption>City at Sunset</figcaption>
      </figure>

      <figure>
        <img src="images/lake.svg" alt="A calm lake surrounded by green hills" width="200">
        <figcaption>Calm Lake</figcaption>
      </figure>

      <figure>
        <img src="images/desert.svg" alt="Golden desert dunes beneath a clear sky" width="200">
        <figcaption>Golden Desert</figcaption>
      </figure>

      <figure>
        <img src="images/night.svg" alt="A crescent moon and stars in a dark night sky" width="200">
        <figcaption>Starry Night</figcaption>
      </figure>

      <figure>
        <img src="images/meadow.svg" alt="A green meadow filled with colorful flowers" width="200">
        <figcaption>Flower Meadow</figcaption>
      </figure>

      <figure>
        <img src="images/waterfall.svg" alt="A waterfall flowing between green cliffs" width="200">
        <figcaption>Forest Waterfall</figcaption>
      </figure>
    </div>
  </main>

  <footer>
    <a href="#top">Jump to the Top</a>
  </footer>
</body>
</html>
